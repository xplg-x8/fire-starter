  # ── node-register — every local node registers ITSELF with Traefik ────────
  # Writes one file per role active on THIS server into the Traefik registry
  # folder (XPLG_TRAEFIK_REGISTRY_PATH, default ./conf/registry):
  #
  #     <registry>/<alias>-<role>.node  content: <role> <alias> <host>:<port>
  #
  # traefik-init (docker-compose.traefik.yml) reconciles that folder into the
  # route table every few seconds, so a node coming up on ANY server joins the
  # group pool with NO edit to .env and NO Traefik restart. Point the registry
  # at the shared/NFS path to make it cluster-wide; leave it local for
  # single-server. Dead entries are harmless — Traefik health-checks them out
  # of the pool, and the file is rewritten on every start.
  #
  # Roles are derived from COMPOSE_PROFILES, so this one container covers
  # whatever bundle this server runs.
  node-register:
    image: ${XPLG_INIT_IMAGE:-alpine:3.24}
    restart: "no"
    user: root
    network_mode: host
    profiles: ["master", "server", "server-additional", "ui", "listener", "processor", "processor-1"]
    environment:
      ACTIVE_PROFILES: "${COMPOSE_PROFILES:-}"
      SELF_ALIAS: "${SELF_ALIAS:-xplg-seed-1}"
      REG_HOST: "${XPLG_TRAEFIK_REGISTER_HOST:-${SELF_ALIAS:-xplg-seed-1}}"
      MASTER_HTTP_PORT: "${MASTER_HTTP_PORT:-30308}"
      UI_HTTP_PORT: "${UI_HTTP_PORT:-30304}"
      LISTENER_HTTP_PORT: "${LISTENER_HTTP_PORT:-30305}"
      PROCESSOR_HTTP_PORT: "${PROCESSOR_HTTP_PORT:-30306}"
      PROCESSOR_1_HTTP_PORT: "${PROCESSOR_1_HTTP_PORT:-30307}"
    volumes:
      - ${XPLG_TRAEFIK_REGISTRY_PATH:-./conf/registry}:/registry:z
    command:
      - sh
      - -ec
      - |
        mkdir -p /registry
        # profile -> roles on this server
        roles=""
        for p in $$(echo "$$ACTIVE_PROFILES" | tr ',' ' '); do
          case "$$p" in
            master)            roles="$$roles master" ;;
            server)            roles="$$roles ui listener processor" ;;
            server-additional) roles="$$roles processor processor-1" ;;
            ui|listener|processor|processor-1) roles="$$roles $$p" ;;
          esac
        done
        [ -n "$$roles" ] || roles="master ui listener processor"
        for r in $$roles; do
          case "$$r" in
            master)      port="$$MASTER_HTTP_PORT" ;;
            ui)          port="$$UI_HTTP_PORT" ;;
            listener)    port="$$LISTENER_HTTP_PORT" ;;
            processor)   port="$$PROCESSOR_HTTP_PORT" ;;
            processor-1) port="$$PROCESSOR_1_HTTP_PORT" ;;
            *) continue ;;
          esac
          f="/registry/$${SELF_ALIAS}-$${r}.node"
          printf '%s %s %s:%s\n' "$$r" "$$SELF_ALIAS" "$$REG_HOST" "$$port" > "$$f.tmp"
          mv "$$f.tmp" "$$f"
          echo "registered $$r -> $$REG_HOST:$$port  ($$f)"
        done
